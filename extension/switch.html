<!doctype html>
<meta charset="utf-8">
<title>Torval</title>
<link rel="stylesheet" href="switch.css">

<label class="picklabel">
  <span>Language</span>
  <select id="language">
    <option value="" disabled selected hidden>Choose a language…</option>
  </select>
</label>

<!--
  The switch is outside the part that waits for a language. Turning Torval
  off is not a thing you do to a language, it is a thing you do to Torval,
  and having to pick a language before you were allowed to switch it off
  was backwards: the likeliest reason to open this panel on a fresh
  install is that the add-on is in the way of the page underneath.
-->
<label class="switch">
  <input type="checkbox" id="on" checked>
  <span class="track"><span class="knob"></span></span>
  <span class="state" id="state">On</span>
</label>

<nav id="doors" hidden>
  <button id="settings">Settings</button>
  <button id="books">Books</button>
</nav>

<p class="note" id="pick-hint">Pick a language above to get started.</p>

<script src="japanese.js"></script>
<script src="scan.js"></script>
<script src="italian.js"></script>
<script src="italian-scan.js"></script>
<script src="spanish.js"></script>
<script src="spanish-scan.js"></script>
<script src="english.js"></script>
<script src="english-scan.js"></script>
<script src="lang.js"></script>
<script src="ui.js"></script>
<script src="switch.js"></script>
