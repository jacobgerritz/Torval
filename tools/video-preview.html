<!doctype html>
<meta charset="utf-8">
<title>LLL video capture test</title>
<!--
  Exercises extension/video.js against a real, seekable video, without needing
  YouTube or a video file on disk.

      node tools/serve.mjs   ->  http://localhost:8137/tools/video-preview.html

  A few seconds of canvas and tone are recorded once, up front, into an actual
  webm — so the <video> below has a duration and can be seeked, which a live
  canvas stream cannot. The tone changes pitch every second, so a clip taken
  from 4s to 6s can be told apart from one taken from 1s to 3s by listening, or
  by looking at its frequencies.

  What this cannot test is content-protected video, where capture is refused by
  design, and YouTube's own subtitle data, which only answers to youtube.com.
-->
<style>
  body { margin: 0; padding: 24px; background: #0f1012; color: #d9dade;
         font: 13px/1.6 -apple-system, "Segoe UI", sans-serif; }
  video { width: 300px; background: #000; border-radius: 4px; }
  pre { background: #17181b; padding: 12px; border-radius: 4px; white-space: pre-wrap; }
</style>

<h3>LLL video capture</h3>
<video id="v" controls playsinline muted></video>
<pre id="out">building a test video…</pre>

<script src="../extension/video.js"></script>
<script>
const SECONDS = 8;
const out = document.getElementById('out');
const video = document.getElementById('v');

// --- make a real webm, so the video has a timeline that can be seeked --------
window.ready = (async () => {
  video.muted = true;   // this page must never make a sound; capture is unaffected
  const canvas = Object.assign(document.createElement('canvas'), { width: 240, height: 135 });
  const ctx = canvas.getContext('2d');
  const audio = new AudioContext();
  const tone = audio.createOscillator();
  const dest = audio.createMediaStreamDestination();
  tone.connect(dest);     // to the recording only, never to the speakers
  tone.start();

  const stream = canvas.captureStream(20);
  dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));

  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  const chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const done = new Promise((r) => { recorder.onstop = r; });
  recorder.start();

  const started = performance.now();
  // A timer, not requestAnimationFrame: rAF does not fire when the pane showing
  // this page is hidden, and the build would simply never finish.
  await new Promise((resolve) => {
    const timer = setInterval(() => {
      const t = (performance.now() - started) / 1000;
      if (t >= SECONDS) { clearInterval(timer); return resolve(); }
      // A different pitch each second, so a clip can be identified by its sound.
      tone.frequency.setValueAtTime(200 + Math.floor(t) * 150, audio.currentTime);
      ctx.fillStyle = `hsl(${Math.floor(t) * 40} 45% 22%)`;
      ctx.fillRect(0, 0, 240, 135);
      ctx.fillStyle = '#fff';
      ctx.font = '28px sans-serif';
      ctx.fillText(t.toFixed(1) + 's', 20, 78);
    }, 40);
  });

  recorder.stop();
  await done;
  tone.stop();

  video.src = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
  await new Promise((r) => { video.onloadeddata = r; });
  // Firefox and Chromium both report Infinity for a recorded webm's duration
  // until it is seeked past the end at least once.
  video.currentTime = 1e6;
  await new Promise((r) => { video.onseeked = r; });
  video.currentTime = 0;
  out.textContent = 'ready — ' + SECONDS + 's of video, seekable';
  return true;
})();
</script>
