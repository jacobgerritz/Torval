<!doctype html>
<meta charset="utf-8">
<title>PREVIEW, not your real LLL reader</title>
<!--
  A page for working on the reader without reloading the extension in Firefox
  every time.

      node tools/serve.mjs   ->  http://localhost:8137/tools/reader-preview.html

  It runs the real reader.html, reader.js and the page scripts LLL loads into
  a book. tools/sample.epub is a small two chapter book to drop on it, ruby
  and all, built by tools/make-epub.mjs. The markup is fetched from the extension rather than copied, so this
  cannot drift out of step with what ships. The fake parts are the dictionary,
  which is not running here, and the storage the book is kept in, which lives
  in memory until the tab is closed.
-->

<style>
  .preview-warning {
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 20;
    box-sizing: border-box;
    width: 100%;
    padding: 8px 20px;
    background: #4a2c22;
    border-top: 1px solid #6b3f30;
    color: #f0d5c6;
    font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
  }
  .preview-warning b { color: #fff; }
</style>

<script src="../extension/japanese.js"></script>
<script src="../extension/deinflect.js"></script>
<script src="../extension/lookup.js"></script>
<script src="preview-words.js"></script>
<script>
// The book is kept in this tab's own session storage rather than in the
// extension's. It survives a reload, so coming back to a book can be tried
// here, and it is gone when the tab closes.
const stored = JSON.parse(sessionStorage.getItem("lll-preview-store") || "{}");
const remember = () => {
  try { sessionStorage.setItem("lll-preview-store", JSON.stringify(stored)); } catch (e) {}
};

window.browser = {
  storage: {
    local: {
      async get(keys) {
        // Same shapes the real storage takes: one name, a list of them, or an
        // object of defaults.
        const names = keys === null || keys === undefined ? Object.keys(stored)
          : typeof keys === "string" ? [keys]
          : Array.isArray(keys) ? keys : Object.keys(keys);
        const out = {};
        for (const name of names) if (name in stored) out[name] = stored[name];
        return out;
      },
      async set(values) { Object.assign(stored, values); remember(); },
      async remove(keys) {
        for (const key of (typeof keys === 'string' ? [keys] : keys)) delete stored[key];
        remember();
      }
    },
    onChanged: { addListener() {} }
  },
  runtime: {
    id: 'preview',
    getURL(path) { return '../extension/' + path; },
    openOptionsPage() {},
    async sendMessage(msg) {
      switch (msg.type) {
        case 'status': return { status: { state: 'ready', progress: 1 } };
        case 'tags': return TAGS;
        case 'lookup': {
          const found = typeof msg.point === 'number'
            ? await LLLLookup.hover(msg.text, msg.point, db)
            : { start: 0, groups: await LLLLookup.search(msg.text, db) };
          for (const group of found.groups) {
            for (const hit of group.hits) {
              hit.band = LLLLookup.frequencyBand(hit.q);
              hit.shared = LLLLookup.sharedTags(hit.entry);
              hit.sharedPos = LLLLookup.sharedPos(hit.entry);
              hit.known = known.has(hit.word);
              hit.ignored = ignored.has(hit.word);
            }
          }
          return { status: { state: 'ready' }, groups: found.groups, start: found.start };
        }
        case 'comprehension': {
          const tokens = await LLLLookup.locateTokens(msg.text, db);
          return { ok: true, result: LLLLookup.coverage(tokens, known, ignored) };
        }
        case 'wordPlaces': {
          const tokens = await LLLLookup.locateTokens(msg.text, db);
          const places = {};
          const unmarked = [];
          tokens.forEach((t, i) => {
            if (!places[t.word]) {
              places[t.word] = [];
              if (ignored.has(t.word) || LLLLookup.isKnown(t, known)) unmarked.push(t.word);
            }
            places[t.word].push(t.start, t.length, i % 2);
          });
          const score = LLLLookup.coverage(tokens, known, ignored);
          return { ok: true, result: { ...score, places, unmarked } };
        }
        case 'setKnown': return { ok: true, result: { word: msg.word, on: msg.known } };
        case 'setIgnored': return { ok: true, result: { word: msg.word, on: msg.ignored } };
        default: return { ok: true, result: null };
      }
    }
  }
};

// The real page, markup and scripts, pulled in rather than copied.
(async () => {
  const html = await (await fetch('../extension/reader.html')).text();
  const page = new DOMParser().parseFromString(html, 'text/html');

  for (const link of page.querySelectorAll('link[rel="stylesheet"]')) {
    const clone = document.createElement('link');
    clone.rel = 'stylesheet';
    clone.href = '../extension/' + link.getAttribute('href');
    document.head.appendChild(clone);
  }
  for (const node of [...page.body.children]) {
    if (node.tagName !== 'SCRIPT') document.body.appendChild(node);
  }

  const warning = document.createElement('div');
  warning.className = 'preview-warning';
  warning.innerHTML = '<b>Preview.</b> No dictionary is running here, so nothing ' +
    'is looked up or scored. The book is forgotten when this tab closes. ';
  const run = document.createElement('button');
  run.textContent = 'Check it against the sample books';
  run.style.cssText = 'margin-left:6px;font:inherit;cursor:pointer';
  const said = document.createElement('span');
  run.onclick = () => check(said);
  warning.append(run, said);
  document.body.appendChild(warning);

  for (const script of page.querySelectorAll('script')) {
    await new Promise((resolve, reject) => {
      const clone = document.createElement('script');
      clone.src = '../extension/' + script.getAttribute('src');
      clone.onload = resolve;
      clone.onerror = reject;
      document.body.appendChild(clone);
    });
  }
})();

// ---------------------------------------------------------------------------
// What the sample books are for
//
// Every one of these is something a real epub does that the reader once got
// wrong. They run on a button rather than on load, so opening this page to
// try a book of your own does not replace it with a fixture.
// ---------------------------------------------------------------------------

async function check(said) {
  const failures = [];
  let passed = 0;
  const is = (name, got, want) => {
    const a = JSON.stringify(got);
    const b = JSON.stringify(want);
    if (a === b) passed++;
    else failures.push(name + ": " + a + " wanted " + b);
  };

  const open = async (path) => {
    const bytes = await (await fetch(path + '?t=' + Date.now())).arrayBuffer();
    const input = document.getElementById('book');
    const carry = new DataTransfer();
    carry.items.add(new File([bytes], path.split('/').pop(), { type: 'application/epub+zip' }));
    input.files = carry.files;
    input.dispatchEvent(new Event('change'));
    await new Promise((r) => setTimeout(r, 700));
    const chapters = [];
    const picker = document.getElementById('chapters');
    const count = Math.max(1, picker.options.length);
    for (let i = 0; i < count; i++) {
      picker.value = String(i);
      picker.dispatchEvent(new Event('change'));
      await new Promise((r) => setTimeout(r, 120));
      chapters.push({
        name: picker.options.length ? picker.options[i].textContent.replace(/^\d+\. /, '') : '',
        paragraphs: [...document.getElementById('page').querySelectorAll('p')].map((p) => p.textContent)
      });
    }
    return { title: document.getElementById('title').textContent, chapters };
  };

  said.textContent = ' running…';
  try {
    const plain = await open('sample.epub');
    is('plain: the title comes from the metadata', plain.title, '種の話');
    is('plain: both chapters, named by their headings',
      plain.chapters.map((c) => c.name), ['第一章', '第二章']);
    is('plain: furigana is thrown away, not read as text',
      plain.chapters[0].paragraphs, ['種がある。', '単子葉植物の一つの科である。']);
    is('plain: a chapter in a subdirectory is found',
      plain.chapters[1].paragraphs, ['すごいですね。', '猫です。']);

    const awkward = await open('sample-awkward.epub');
    is('awkward: the title comes from the metadata', awkward.title, 'むかしの話');
    is('awkward: chapters are named by the toc.ncx, and the cover is dropped',
      awkward.chapters.map((c) => c.name), ['はじめに', 'второй', 'Section 3']);
    is('awkward: a paragraph inside a blockquote is read once, not twice',
      awkward.chapters[0].paragraphs, ['種がある。', '猫です。']);
    is('awkward: a chapter built out of bare divs keeps its paragraphs',
      awkward.chapters[1].paragraphs, ['すごいですね。', '本を読みました。']);
    is('awkward: line breaks end a paragraph',
      awkward.chapters[2].paragraphs, ['今日は暑いですね。', '台湾に行きました。']);
  } catch (err) {
    failures.push('threw: ' + err.message);
  }

  said.textContent = failures.length ? ' ' + failures.length + ' failed of ' +
    (passed + failures.length) + ': ' + failures.join(' | ') : ' all ' + passed + ' checks passed';
  said.style.color = failures.length ? '#ffb3a7' : '#bfe3bf';
}
</script>
