<!doctype html>
<meta charset="utf-8">
<title>PREVIEW, not your real LLL settings</title>
<!--
  A page for working on how the settings look, without reloading the extension
  in Firefox every time.

      node tools/serve.mjs   ->  http://localhost:8137/tools/options-preview.html

  It runs the real options.html, options.js and known.js. The markup is not
  copied here, it is fetched from the extension itself, so this can never
  drift out of step with what actually ships. The only fake parts are Anki,
  which is not running, and the stored word list, which lives in memory.

  Because it renders the real page it looks exactly like the real settings,
  which is confusing enough to have caught somebody out already, hence the
  banner. Nothing done here can reach the extension's own storage: this is an
  ordinary web page on localhost, and the word list below exists only until
  the tab is closed.
-->

<style>
  .preview-warning {
    position: sticky;
    top: 0;
    z-index: 10;
    box-sizing: border-box;
    width: 100%;
    padding: 10px 24px;
    background: #4a2c22;
    border-bottom: 1px solid #6b3f30;
    color: #f0d5c6;
    font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
  }
  .preview-warning b { color: #fff; }
  .preview-warning span { color: #d0a693; }
</style>

<script>
// --- stand in for Anki and for browser storage ------------------------------
const DECKS = ['Default', '日本語::Mining', 'Core 2k'];
const MODELS = ['LLL', 'Basic'];
const FIELDS = { LLL: ['Word', 'Reading', 'Sentence', 'Definition', 'Audio', 'Pitch', 'Image'], Basic: ['Front', 'Back'] };

// A word list big enough to show what browsing a real one is like, including
// the scrolling and the search. The filler is named so that nobody reading it
// could mistake it for a word they once learned.
const known = new Map();
const SAMPLE = ['本', '人', '車', '食べる', '読む', '図書館', '日本語', '勉強', '新しい', '親切', '料理', '上手', '買う'];
SAMPLE.forEach((word, i) => known.set(word, Date.now() - i * 86400000));
for (let i = 0; i < 400; i++) known.set('（例' + i + '・にせもの）', Date.now() - (i + 20) * 3600000);

// A few words on the ignored list too, so that panel has something to show.
const ignored = new Map();
['ネカフェ', '（にせもの・な・まえ）', 'ＡＢＣ'].forEach((word, i) => ignored.set(word, Date.now() - i * 3600000));

let stored = { ankiConfig: { deck: '日本語::Mining', model: 'LLL', tags: ['lll'], fields: {} } };

window.browser = {
  storage: {
    local: {
      async get(key) { return key in stored ? { [key]: stored[key] } : {}; },
      async set(values) { Object.assign(stored, values); }
    }
  },
  runtime: {
    id: 'preview',
    getURL(path) { return '../extension/' + path; },
    openOptionsPage() {},
    async sendMessage(msg) {
      switch (msg.type) {
        case 'ankiDescribe': return { ok: true, result: { decks: DECKS, models: MODELS } };
        case 'ankiFields':   return { ok: true, result: FIELDS[msg.model] || [] };
        case 'knownList':
          return { ok: true, result: [...known].map(([word, added]) => ({ word, added }))
            .sort((a, b) => b.added - a.added) };
        case 'ignoredList':
          return { ok: true, result: [...ignored].map(([word, added]) => ({ word, added }))
            .sort((a, b) => b.added - a.added) };
        case 'exportWords':
          return { ok: true, result: {
            format: 'lll-words', version: 1, saved: new Date().toISOString(),
            known: Object.fromEntries(known), ignored: Object.fromEntries(ignored)
          } };
        case 'importWords': {
          const data = msg.data;
          if (!data || data.format !== 'lll-words') return { ok: false, error: 'That is not a file LLL saved.' };
          const added = { known: 0, ignored: 0 };
          for (const [word, when] of Object.entries(data.known || {})) {
            if (!known.has(word)) { known.set(word, when); added.known++; }
          }
          for (const [word, when] of Object.entries(data.ignored || {})) {
            if (!ignored.has(word)) { ignored.set(word, when); added.ignored++; }
          }
          for (const word of known.keys()) ignored.delete(word);
          return { ok: true, result: { added, known: known.size, ignored: ignored.size } };
        }
        case 'forgetIgnored': {
          let removed = 0;
          for (const word of msg.words) if (ignored.delete(word)) removed++;
          return { ok: true, result: { removed, total: ignored.size } };
        }
        case 'extractWords':
          return { ok: true, result: [...new Set(msg.text.match(/[一-鿿ぁ-ヿ]+/g) || [])] };
        case 'addKnownWords': {
          let added = 0;
          for (const word of msg.words) if (!known.has(word)) { known.set(word, Date.now()); added++; }
          return { ok: true, result: { added, total: known.size } };
        }
        case 'forgetWords': {
          let removed = 0;
          for (const word of msg.words) if (known.delete(word)) removed++;
          return { ok: true, result: { removed, total: known.size } };
        }
      }
    }
  }
};

// The real page, markup and all, pulled in rather than copied, then its own
// scripts run on top of it exactly as they do in the extension.
(async () => {
  const html = await (await fetch('../extension/options.html')).text();
  const page = new DOMParser().parseFromString(html, 'text/html');

  for (const link of page.querySelectorAll('link[rel="stylesheet"]')) {
    const clone = document.createElement('link');
    clone.rel = 'stylesheet';
    clone.href = '../extension/' + link.getAttribute('href');
    document.head.appendChild(clone);
  }
  const layout = page.querySelector('.layout');
  const warning = document.createElement('div');
  warning.className = 'preview-warning';
  warning.innerHTML = '<b>Preview, made-up data.</b> ' +
    '<span>This is not your settings and not your words. Nothing here is saved, ' +
    'and nothing here can reach the extension. Your real settings open from ' +
    'LLL&rsquo;s toolbar button, or the &#9881; on the bar at the top of a page.</span>';
  // Above the sidebar and the panel both, not squeezed into either, the
  // layout below is a flex row, and a banner stuffed inside it would just
  // become a third column rather than a strip across the top.
  document.body.appendChild(warning);
  document.body.appendChild(layout);

  for (const script of page.querySelectorAll('script')) {
    await new Promise((resolve, reject) => {
      const clone = document.createElement('script');
      clone.src = '../extension/' + script.getAttribute('src');
      clone.onload = resolve;
      clone.onerror = reject;
      document.body.appendChild(clone);
    });
  }
})();
</script>
